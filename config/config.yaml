# Parent directory for all pipeline outputs.
artifacts_root: artifacts


data_ingestion: 
  root_dir: artifacts/data_ingestion
  source_data: data/raw/laptops.csv
  train_data_path: artifacts/data_ingestion/train.csv
  test_data_path: artifacts/data_ingestion/test.csv



data_validation:
  root_dir: artifacts/data_validation
  schema_file: schema.yaml
  train_data_path: artifacts/data_ingestion/train.csv
  status_file: artifacts/data_validation/status.txt # Simple flag: True → validation passed  False → validation failed -> [This is very useful in production pipelines.]


data_transformation:
  root_dir: artifacts/data_transformation
  train_data_path: artifacts/data_ingestion/train.csv
  test_data_path: artifacts/data_ingestion/test.csv
  transformed_train_path: artifacts/data_transformation/train.npy
  transformed_test_path: artifacts/data_transformation/test.npy
  preprocessor_path: artifacts/data_transformation/preprocessor.pkl
  target_column: Final Price 


model_trainer:
  root_dir: artifacts/model_trainer
  train_data_path: artifacts/data_transformation/train.npy
  test_data_path: artifacts/data_transformation/test.npy
  model_path: artifacts/model_trainer/model.pkl
  experiment_name: laptop_price_prediction
  model_params:
    n_estimators: 200
    max_depth: 10
    random_state: 42


model_evaluation:
  root_dir: artifacts/model_evaluation
  model_path: artifacts/model_trainer/model.pkl
  test_data_path: artifacts/data_transformation/test.npy
  metric_file: artifacts/model_evaluation/metrics.yaml
  min_r2_score: 0.6
